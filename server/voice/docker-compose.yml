# Local speech stack for Home Assistant voice (set up 2026-09-11).
# Ports are bound to localhost only: HA runs in host network mode on this box.
services:
  whisper:
    container_name: wyoming-whisper
    image: rhasspy/wyoming-whisper:latest
    command: --model deepdml/faster-whisper-large-v3-turbo-ct2 --compute-type int8 --language auto --beam-size 1
    environment:
      # CTranslate2 defaults to a few threads; the box has 16.
      OMP_NUM_THREADS: "12"
    volumes:
      - /opt/voice/whisper-data:/data
    ports:
      - "127.0.0.1:10300:10300"
    restart: unless-stopped
  piper:
    container_name: wyoming-piper
    image: rhasspy/wyoming-piper:latest
    command: --voice en_US-lessac-medium
    volumes:
      - /opt/voice/piper-data:/data
    ports:
      - "127.0.0.1:10200:10200"
    restart: unless-stopped
  langproxy:
    # Strips the language from Transcribe so Whisper auto-detects it (one wake word,
    # two languages). Host network: listens 127.0.0.1:10301 -> whisper 127.0.0.1:10300.
    container_name: wyoming-langproxy
    build: /opt/voice/langproxy
    network_mode: host
    command: --listen tcp://127.0.0.1:10301 --upstream tcp://127.0.0.1:10300 --name-suffix=-auto --langid-model tiny --languages en,ru --default-language en --threads 4
    volumes:
      - /opt/voice/langproxy-data:/data
    depends_on:
      - whisper
    restart: unless-stopped
